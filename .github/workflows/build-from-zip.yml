name: Build Suda APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip -d "$HOME"

      - name: Extract Suda project
        run: |
          mkdir -p /tmp/suda
          unzip -q Suda_Phone_Build_Ready.zip -d /tmp/suda
          find /tmp/suda -name settings.gradle -type f

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find /tmp/suda -name settings.gradle -type f | head -1)")
          cd "$PROJECT"
          "$HOME/gradle-8.2.1/bin/gradle" assembleDebug --no-daemon

      - name: Upload Suda APK
        uses: actions/upload-artifact@v4
        with:
          name: Suda-debug-apk
          path: /tmp/suda/**/app/build/outputs/apk/debug/app-debug.apk
